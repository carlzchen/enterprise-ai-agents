# 技术助手依赖的基础设施：MongoDB + MinIO + Milvus(含 etcd) + Attu + Redis
# MySQL 复用 MiniERP 的实例（库 assistant 存父文档；只读账号查询 ERP 业务数据）
#
#   启动： docker compose up -d
#   停止： docker compose down        （保留数据）
#   清空： docker compose down -v     （向量库、会话历史、图片全部删除）
#
# 端口与本机其他项目（tcm-* / smartdeck-*）错开：
#   Milvus 19531 / MongoDB 27018 / MinIO 9010(控制台 9011) / Redis 6381 / Attu 3001

name: minierp-assistant

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 一次性建桶，并确保桶是私有的：知识库图片由服务鉴权后现签临时链接展示，不允许匿名读
  minio-init:
    image: minio/mc:RELEASE.2023-03-23T20-03-04Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-minierp-kb} &&
      mc anonymous set none local/${MINIO_BUCKET_NAME:-minierp-kb}/images &&
      mc anonymous set none local/${MINIO_BUCKET_NAME:-minierp-kb} &&
      echo bucket ready;
      "
    restart: "no"

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 与 pymilvus 2.6.x 客户端匹配
  milvus:
    image: milvusdb/milvus:v2.6.23
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: milvus-bucket
    ports:
      - "19531:19530"
      - "9092:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  attu:
    image: zilliz/attu:v2.6.0
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3001:3000"
    depends_on:
      milvus:
        condition: service_healthy

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 产品知识图谱（可选）。不启动时问答会自动跳过图谱这一路
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-minierp-kg}
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j_data:/data

  # 消息队列：批量入库、导出、通知等离线任务走这里（管理页面 http://localhost:15673 ）
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-minierp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-minierp-mq}
    ports:
      - "5673:5672"
      - "15673:15672"
      - "15693:15692"
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 监控：Prometheus 抓指标（http://localhost:9091），Grafana 看板（http://localhost:3003，匿名只读）
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-minierp-grafana}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/minierp-ai.json
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
    ports:
      - "3003:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

  # 链路追踪（可选，按需启动）：docker compose --profile langfuse up -d ，页面 http://localhost:3002
  langfuse-db:
    image: postgres:16-alpine
    profiles: ["langfuse"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-minierp-langfuse}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["langfuse"]
    restart: unless-stopped
    depends_on:
      langfuse-db: { condition: service_healthy }
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-minierp-langfuse}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-only-change-me}
      SALT: ${LANGFUSE_SALT:-local-dev-only-change-me}
      TELEMETRY_ENABLED: "false"
      # 首次启动自动建好组织、项目和一对密钥，省得手工点；这些值只用于本地演示
      LANGFUSE_INIT_ORG_ID: minierp
      LANGFUSE_INIT_ORG_NAME: MiniERP
      LANGFUSE_INIT_PROJECT_ID: minierp-ai
      LANGFUSE_INIT_PROJECT_NAME: 问数与知识库
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-minierp}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-minierp}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL:-admin@minierp.local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD:-minierp-langfuse}

volumes:
  mongo_data:
  minio_data:
  etcd_data:
  milvus_data:
  redis_data:
  neo4j_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  langfuse_db:
