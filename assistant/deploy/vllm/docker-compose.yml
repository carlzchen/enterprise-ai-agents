# 公司 GPU 服务器上的模型服务（不是在开发机上跑的）：docker compose -f deploy/vllm/docker-compose.yml up -d
# 需要：NVIDIA 显卡驱动 + nvidia-container-toolkit。本文件没有在真实 GPU 上验证过，参数按 vLLM 和 Qwen3 的公开文档写的，上线前要实测。
services:
  # 主模型：Qwen3-32B（AWQ 量化），单张 48G 显存可以放下
  qwen:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - ${MODEL_DIR:-/data/models}:/models
    command:
      - --model=/models/Qwen3-32B-AWQ
      - --served-model-name=qwen3-32b
      - --max-model-len=32768
      - --gpu-memory-utilization=0.92
      - --enable-auto-tool-choice          # 问数的 Function Calling 需要这两项
      - --tool-call-parser=hermes
      - --max-num-seqs=32                  # 同时合批推理的请求数上限
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["0"], capabilities: [gpu] }]

  # 备用模型：主模型熔断时退到它（小一号，放在另一张卡上）
  qwen-small:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ipc: host
    ports:
      - "8001:8000"
    volumes:
      - ${MODEL_DIR:-/data/models}:/models
    command:
      - --model=/models/Qwen3-8B
      - --served-model-name=qwen3-8b
      - --max-model-len=16384
      - --gpu-memory-utilization=0.55
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["1"], capabilities: [gpu] }]
  # 向量模型和重排模型（BGE-M3、bge-reranker-v2-m3）用项目里的 app/platform/model_server.py，和备用模型共用第二张卡：
  #   BGE_DEVICE=cuda BGE_FP16=true BGE_RERANKER_DEVICE=cuda BGE_RERANKER_FP16=true python -m app.platform.model_server
