# 企业知识库的部署编排：知识库服务 + 入口网关（Nginx，带前端静态页）。
# 数据和中间件（MySQL、Milvus、MongoDB、MinIO、Redis、RabbitMQ、Langfuse）沿用 assistant/docker-compose.yml，这里通过它的网络访问。
# 用法（在 assistant 目录）：
#   docker compose up -d                                         # 先起中间件
#   docker compose -f deploy/kbase/docker-compose.yml up -d --build
# 生产环境：.env 里换成真实的 SSO（SSO_ISSUER / SSO_CLIENT_ID / SSO_CLIENT_SECRET / SSO_REDIRECT_URI / SSO_SCIM_URL / SSO_SCIM_TOKEN）、
#   vLLM 地址（LLM_BASE_URL、VL_BASE_URL）、KBASE_ALLOWED_NETWORKS（和 nginx 的 allowlist.conf 保持一致）；
#   证书放 deploy/nginx/certs/kb.crt、kb.key；宿主机端口只绑内网地址（KB_LISTEN_ADDR）。

name: kbase-prod

services:
  kbase:
    build:
      context: ../..
    image: minierp/kbase:latest
    env_file: ../../.env
    environment:
      APP_MODULE: app.kbase.server:app
      PORT: "8094"
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MILVUS_URL: http://milvus:19530
      MONGO_URL: mongodb://mongo:27017
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      KBASE_TRUSTED_PROXIES: 172.16.0.0/12          # 只采信网关（同一个 Docker 网络）写的来源地址
    volumes:
      - kb_models:/models                           # 向量和重排模型的缓存，容器重建不用重新下载
      - kb_output:/app/output
    restart: unless-stopped
    networks: [infra]
    expose: ["8094"]
    deploy:
      resources:
        limits: {memory: 8g}

  gateway:
    build:
      context: ../../../frontend
    image: minierp/kbase-gateway:latest
    depends_on: [kbase]
    volumes:
      - ../nginx/kbase.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/allowlist.conf:/etc/nginx/kb/allowlist.conf:ro
      - ../nginx/certs:/etc/nginx/kb/certs:ro
    ports:
      - "${KB_LISTEN_ADDR:-127.0.0.1}:443:443"     # 只绑内网地址，不要写 0.0.0.0
      - "${KB_LISTEN_ADDR:-127.0.0.1}:80:80"
    restart: unless-stopped
    networks: [infra]

networks:
  infra:
    name: minierp-assistant_default                 # assistant/docker-compose.yml 起的中间件所在的网络
    external: true

volumes:
  kb_models:
  kb_output:
