# 企业知识库的入口网关。原则：只在公司内网提供服务，没有公网入口；远程办公用公司电脑连 VPN 后，从 VPN 地址池访问。
# 两道闸：这里按来源网段放行（allowlist.conf），应用里再校验一次（app/kbase/auth/network.py），防止有人绕过网关直连服务端口。

limit_req_zone $binary_remote_addr zone=kb_ask:10m rate=30r/m;      # 按来源地址限流（应用里还有按用户的限流）
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name kb.corp.example.com;
    include /etc/nginx/kb/allowlist.conf;
    return 301 https://$host$request_uri;
}

server {
    # 只监听内网网卡（KB_LISTEN_ADDR 换成服务器的内网地址；容器里用 0.0.0.0，由宿主机端口映射只绑内网地址）
    listen 443 ssl;
    http2 on;
    server_name kb.corp.example.com;

    ssl_certificate     /etc/nginx/kb/certs/kb.crt;          # 公司内部 CA 签发
    ssl_certificate_key /etc/nginx/kb/certs/kb.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/kb/allowlist.conf;                     # 内网 + VPN 网段，其余一律 403

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;            # 登录回跳的凭证在 # 后面，不会进 Referer；再加一道
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # 应用看到的来源地址：用这里看到的对端地址覆盖（不是追加），客户端自己带的 X-Forwarded-For 不算数
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /kbase-api/ask {
        limit_req zone=kb_ask burst=10 nodelay;
        proxy_pass http://kbase:8094/ask;
        proxy_http_version 1.1;
        proxy_buffering off;                                  # SSE 流式输出不能缓冲
        proxy_read_timeout 300s;
    }

    # SSO 回调和后端通道注销：SSO 服务器在内网，回调来源同样受白名单限制
    location /kbase-api/auth/ {
        proxy_pass http://kbase:8094/auth/;
    }

    # 运维接口只给监控和运维网段
    location ~ ^/kbase-api/(metrics|internal/) {
        allow 10.10.0.0/24;                                   # 监控 / 运维网段（示例）
        deny all;
        proxy_pass http://kbase:8094;
    }

    location /kbase-api/ {
        proxy_pass http://kbase:8094/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
