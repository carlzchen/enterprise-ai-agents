[project]
name = "minierp-assistant"
version = "0.1.0"
description = "MiniERP 产品技术助手：面向微特电机产品知识的企业级 RAG（导入图 + 查询图 + 评估）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "requests>=2.32",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "openai-agents>=0.2",
    "pymilvus[model]==2.6.10",
    "pymilvus-model==0.3.2",
    "flagembedding==1.3.5",
    "transformers==4.57.6",
    "torch>=2.4",
    "minio>=7.2",
    "pymongo>=4.8",
    "pymysql>=1.1",
    "redis>=5.0",
    "reportlab>=4.2",
    "matplotlib>=3.9",
    "pypdf>=6.19.0",
    "sqlglot>=30.21.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "ezdxf>=1.4.4",
    "python-pptx>=1.0.2",
    "neo4j>=6.4.0",
    "ragas>=0.4.3",
    "docling>=2.134.0",
    "pika>=1.4.4",
    "apscheduler>=3.11.3",
    "prometheus-client>=0.26.0",
    "langfuse>=2.50,<3",
    "deepagents>=0.7.25",
    "pdfplumber>=0.11.10",
    "langgraph-checkpoint-sqlite>=3.1.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
