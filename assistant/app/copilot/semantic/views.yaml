  date_col: period
  access: {ADMIN: all, HR: all, MANAGEMENT: all, FINANCE: all, PRODUCTION: dept, "*": self}
  row_scope: {dept_id: dept_id, employee_id: employee_id}
  columns:
    employee_id: 员工 ID
    period: 工资月份 YYYY-MM
    dept_id: 部门 ID
    dept_name: 部门名称
    line_code: 产线
    team: 班组
    cost_type: 成本类型，PRODUCTION / SALES / ADMIN / RND
    wage_type: 计薪方式，MONTHLY 月薪 / PIECE 计件
    scheduled_days: 应出勤天数
    attend_days: 实际出勤天数
    leave_days: 请假天数
    absent_days: 旷工天数
    overtime_hours: 加班工时
    base_pay: 基本工资
    piece_qty: 分摊到个人的良品数
    piece_pay: 计件工资
    guarantee_topup: 保底补差（计件不足保底的补足金额）
    overtime_pay: 加班工资
    deduction: 缺勤扣款
    gross_pay: 应发工资
    social_employee: 个人社保公积金
    income_tax: 个税
    net_pay: 实发工资
    social_employer: 单位社保公积金
    emp_no: 工号
    name: 姓名

v_payroll:
