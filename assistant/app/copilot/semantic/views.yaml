  fresh_as: v_attendance
  columns:
    employee_id: 员工 ID
    leave_type: 请假类型，ANNUAL 年假 / SICK 病假 / PERSONAL 事假
    start_date: 开始日期
    end_date: 结束日期
    days: 请假天数
    reason: 请假事由
    status: 状态，PENDING 审批中 / APPROVED 已批准 / REJECTED 已驳回 / WITHDRAWN 已撤回
    emp_no: 工号
    name: 姓名
    dept_name: 部门名称

v_payslip:
  title: 工资条
  desc: 每名员工每月一行。查人工成本、人均工资、计件工资、保底补差用这张。人工成本 = gross_pay + social_employer。
