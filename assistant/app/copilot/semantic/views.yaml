# 数据语义库 + 权限配置：每个白名单视图一段。
#   access      角色 → 可见范围：all 全部行 / dept 本部门及下级部门 / self 只看本人；"*" 是其他角色的默认值；没列出的角色无权访问
#   row_scope   行级过滤用哪一列：dept_id / dept_name / line_code 用于 dept 范围，employee_id 用于 self 范围
#   sensitive   敏感列 → 能看到这一列的角色（其他角色整列不返回）
#   mask        需要打码的列 → 能看到明文的角色（其他角色看到首尾几位）
#   fresh_as    数据截止日期跟随哪张视图（员工档案没有自己的业务日期，跟随考勤）
#   columns     字段中文说明（没写说明的字段启动时从数据库补齐，只有字段名）
# 白名单要和 mysql-init/02_copilot.sql 的授权保持一致。

v_employee:
  title: 员工档案
  desc: 每名员工一行（含已离职）。查在职人数、人员结构、司龄、入离职日期用这张。
  questions: [现在有多少人, 各部门人数, 劳务派遣占比, 谁离职了, 司龄分布]
  fresh_as: v_attendance
  access: {"*": all}
  row_scope: {dept_id: dept_id, employee_id: id, line_code: line_code}
  sensitive:
    base_salary: [ADMIN, HR, MANAGEMENT, FINANCE]
    social_base: [ADMIN, HR, MANAGEMENT, FINANCE]
  columns:
    id: 员工 ID
    emp_no: 工号
    name: 姓名
    gender: 性别，M 男 / F 女
    dept_id: 部门 ID
    dept_name: 部门名称
    position_name: 岗位名称
    grade: 职级，如 P2、M3
    manager_name: 直属上级姓名
    line_code: 所属产线 L1–L8，职能人员为空
    team: 班组 A / B / C
    employment_type: 用工类型，FULL_TIME 正式 / DISPATCH 劳务派遣 / INTERN 实习
    wage_type: 计薪方式，MONTHLY 月薪 / PIECE 计件
    base_salary: 月基本工资（计件员工为保底工资）
    social_base: 社保公积金缴费基数
    hire_date: 入职日期
    leave_date: 离职日期，在职为空
    leave_reason: 离职原因
    status: 状态，PROBATION 试用 / ACTIVE 在职 / LEFT 离职
    tenure_months: 司龄（月）

v_employee_pii:
  title: 员工敏感信息
  desc: 每名员工一行，只有身份证号、工资卡号、手机号这三项敏感信息。无权看明文的角色只能看到首尾各 4 位。
  questions: [身份证号, 银行卡号, 工资卡, 手机号, 联系方式]
  access: {ADMIN: all, HR: all, FINANCE: all, MANAGEMENT: all, "*": self}
  row_scope: {dept_id: dept_id, employee_id: employee_id}
  mask:
    id_card: [ADMIN, HR]
    bank_account: [ADMIN, HR, FINANCE]
    phone: [ADMIN, HR]
  columns:
    employee_id: 员工 ID
    emp_no: 工号
    name: 姓名
    dept_name: 部门名称
    status: 状态，PROBATION 试用 / ACTIVE 在职 / LEFT 离职
    id_card: 身份证号
    bank_account: 工资卡号
    phone: 手机号

v_employee_change:
  title: 员工异动记录
  desc: 入职、转正、离职等异动，一次异动一行。
  questions: [上月入职多少人, 转正记录]
  date_col: change_date
  fresh_as: v_attendance
  access: {ADMIN: all, HR: all, MANAGEMENT: all}
  sensitive:
    from_salary: [ADMIN, HR, MANAGEMENT]
    to_salary: [ADMIN, HR, MANAGEMENT]
  columns:
    employee_id: 员工 ID
    change_type: 异动类型，HIRE 入职 / REGULAR 转正 / LEAVE 离职
    change_date: 异动日期
    from_dept: 原部门
    to_dept: 新部门
    emp_no: 工号
    name: 姓名
    remark: 备注

v_dept:
  title: 部门
  desc: 部门树，含负责人和当前在职人数。
  access: {"*": all}
  columns:
    id: 部门 ID
    code: 部门编码
    name: 部门名称
    parent_name: 上级部门
    manager_name: 部门负责人
    cost_type: 成本类型，PRODUCTION 制造费用 / SALES 销售费用 / ADMIN 管理费用 / RND 研发费用
    headcount: 当前在职人数

v_attendance:
  title: 考勤日记录
  desc: 每名员工每个工作日一行。查出勤率、迟到、旷工、加班工时用这张。
  questions: [出勤率, 加班工时, 加班率, 迟到次数, 旷工]
  date_col: work_date
  access: {ADMIN: all, HR: all, MANAGEMENT: all, PRODUCTION: dept, "*": self}
  row_scope: {dept_id: dept_id, employee_id: employee_id, line_code: line_code}
  columns:
    employee_id: 员工 ID
    work_date: 考勤日期
    status: 考勤状态，NORMAL 正常 / LATE 迟到 / ABSENT 旷工 / LEAVE 请假
    work_hours: 当日出勤工时
    overtime_hours: 当日加班工时
    leave_type: 请假类型，ANNUAL 年假 / SICK 病假 / PERSONAL 事假
    emp_no: 工号
    name: 姓名
    dept_id: 部门 ID
    dept_name: 部门名称
    line_code: 产线
    team: 班组

v_leave:
  title: 请假单
  desc: 一张请假单一行。
  questions: [请假天数, 病假多少人]
