server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # 经营与人力数据分析 Copilot（宿主机上运行的 Python 服务）；SSE 需要关闭缓冲
  location /copilot-api/ {
    proxy_pass http://host.docker.internal:8093/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
  }

  # 销售与采购跟单 Workflow（宿主机上运行的 Python 服务）
  location /workflow-api/ {
    proxy_pass http://host.docker.internal:8095/;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
  }

  # 企业知识库（宿主机上运行的 Python 服务）；SSE 需要关闭缓冲，上传文件放宽到 50m
  location /kbase-api/ {
    proxy_pass http://host.docker.internal:8094/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 50m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
